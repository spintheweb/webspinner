name: Build and publish Webspinner Docker image

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Deno version
        id: deno
        run: |
          if [ -f deployment/.deno-version ]; then
            V=$(cat deployment/.deno-version)
          elif [ -f .deno-version ]; then
            V=$(cat .deno-version)
          else
            V=2.3.0
          fi
          echo "DENO_VERSION=$V" >> "$GITHUB_ENV"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine image tags list (latest only for semver tags)
        id: tags
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            if [[ "${GITHUB_REF}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              {
                echo "ghcr.io/spintheweb/webspinner:${TAG}"
                echo "ghcr.io/spintheweb/webspinner:latest"
              } > tags.txt
            else
              echo "ghcr.io/spintheweb/webspinner:${TAG}" > tags.txt
            fi
          else
            # Branch builds (no push) use a single local tag
            echo "ghcr.io/spintheweb/webspinner:latest" > tags.txt
          fi
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          cat tags.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Determine build platforms
        id: platforms
        run: |
          # For proper release tags like v1.2.3, build multi-arch; otherwise (e.g., test tags, branches) build amd64 only
          if [[ "${GITHUB_REF}" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          else
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./deployment/Dockerfile
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          platforms: ${{ steps.platforms.outputs.platforms }}
          provenance: false
          sbom: false
          build-args: |
            DENO_VERSION=${{ steps.deno.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}
