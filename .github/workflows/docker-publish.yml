name: Build and publish Webspinner Docker image

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Deno version
        id: deno
        run: |
          if [ -f deployment/.deno-version ]; then
            echo "DENO_VERSION=$(cat deployment/.deno-version)" >> "$GITHUB_ENV"
          elif [ -f .deno-version ]; then
            echo "DENO_VERSION=$(cat .deno-version)" >> "$GITHUB_ENV"
          else
            echo "DENO_VERSION=2.3.0" >> "$GITHUB_ENV"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./
          file: ./deployment/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            DENO_VERSION=${{ env.DENO_VERSION }}
          tags: |
            ghcr.io/spintheweb/webspinner:${{ steps.tag.outputs.tag }}
            ghcr.io/spintheweb/webspinner:latest
